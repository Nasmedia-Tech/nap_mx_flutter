name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flutter-and-android:
    runs-on: [self-hosted, macOS, ARM64]
    strategy:
      fail-fast: false
      matrix:
        kotlin: ['2.1.0', '2.2.10']
    env:
      ORG_GRADLE_PROJECT_napMx.kotlinVersion: ${{ matrix.kotlin }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          # The persistent runner already retains the SDK and pub cache.
          cache: false
      - name: Install dependencies
        run: |
          flutter pub get
          flutter pub get --directory example
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: |
          flutter test
          cd example
          flutter test
      - name: Package dry run
        run: dart pub publish --dry-run
      - name: Android debug and release builds
        working-directory: example
        run: |
          flutter build apk --release --no-pub
          flutter build apk --debug --no-pub
      - name: Android plugin unit tests
        working-directory: example/android
        run: ./gradlew :nap_mx_flutter:testDebugUnitTest --console=plain

  ios-simulator:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          # The persistent runner already retains the SDK and pub cache.
          cache: false
      - name: Install dependencies
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get
          flutter pub get --directory example
      # The persistent runner keeps Xcode and SwiftPM caches between jobs. Module
      # products built against an older nap mx SDK then break explicit module
      # builds after an SDK update ("Missing required module ..."), so drop
      # this project's entries before every iOS build.
      - name: Clear stale Xcode and SwiftPM caches
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          rm -rf ~/Library/Developer/Xcode/DerivedData/Runner-*
          rm -rf ~/Library/Caches/org.swift.swiftpm/repositories/iOS-SSP-*
          rm -rf ~/Library/Caches/org.swift.swiftpm/artifacts/*iOS-SSP*
      - name: Build iOS Simulator
        working-directory: example
        run: flutter build ios --simulator --no-codesign --no-pub
      - name: iOS plugin unit tests
        working-directory: example
        run: |
          nap_mx_simulator_id=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, group in devices.items()
                     if "iOS" in runtime for d in group if d["name"].startswith("iPhone")))')
          xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
            -destination "platform=iOS Simulator,id=$nap_mx_simulator_id" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
